<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beautiful Todo List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;

}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

#todo{
    width:420px;
    background:lch(100% 0.01 296.81 / 0.142);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:25px;
    
    
}

h1{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.input-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#00c6ff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:aqua;
    transform:scale(1.05);
}

#list{
    margin-top:20px;
    background:white;
    border-radius:12px;
    padding:15px;
    min-height:250px;
    
}

ol{
    list-style-type:lower-alpha;
    padding-left:25px;
}

li{
    font-size:18px;
    padding:10px;
    margin:8px 0;
    background:#f5f5f5;
    border-radius:8px;
    transition:.3s;
}

li:hover{
    background:#dff6ff;
    transform:translateX(5px);
}
</style>
</head>

<body>

<div id="todo">

<h1>Todo List</h1>

<div class="input-box">
<input type="text" id="task" placeholder="Enter your task">
<button onclick="addTask()">Add</button>
</div>

<div id="list">
<ol id="tasks"></ol>
</div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
displayTasks();

function addTask(){

    let input=document.getElementById("task");

    if(input.value.trim()==""){
        alert("Please enter a task!");
        return;
    }

    tasks.push(input.value);

    localStorage.setItem("tasks",JSON.stringify(tasks));

    displayTasks();

    input.value="";
    input.focus();
}

function displayTasks(){

    let list=document.getElementById("tasks");
    list.innerHTML="";

    for(let i=0;i<tasks.length;i++){

        let li=document.createElement("li");
        li.innerHTML=tasks[i];

        list.appendChild(li);
    }

}

</script>

</body>
</html>
