<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Login Page</title>
<script>// ==============================
// Selecting Elements
// ==============================

const email = document.getElementById("email");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const loginBox = document.querySelector(".login");
const closeBtn = document.querySelector(".close");
const chatBtn = document.querySelector(".chat");
const body = document.body;

// ==============================
// Disable Login Initially
// ==============================

loginBtn.disabled = true;

// ==============================
// Enable Button
// ==============================

function enableButton() {

    if(email.value.trim() !== "" && password.value.trim() !== ""){

        loginBtn.disabled = false;
        loginBtn.style.opacity = "1";

    }

    else{

        loginBtn.disabled = true;
        loginBtn.style.opacity = "0.5";

    }

}

email.addEventListener("input", enableButton);
password.addEventListener("input", enableButton);

// ==============================
// Email Validation
// ==============================

function validEmail(emailAddress){

    let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    return pattern.test(emailAddress);

}

// ==============================
// Login
// ==============================

loginBtn.addEventListener("click", function(){

    let emailValue = email.value.trim();
    let passwordValue = password.value.trim();

    if(emailValue==""){

        alert("Email is Required");
        email.focus();
        return;

    }

    if(!validEmail(emailValue)){

        alert("Invalid Email");
        email.focus();
        return;

    }

    if(passwordValue==""){

        alert("Password is Required");
        password.focus();
        return;

    }

    if(passwordValue.length<6){

        alert("Password must contain minimum 6 characters");
        password.focus();
        return;

    }

    alert("Login Successful");

    localStorage.setItem("Email",emailValue);

});

// ==============================
// Close Login Box
// ==============================

closeBtn.addEventListener("click",function(){

    loginBox.style.display="none";

});

// ==============================
// Double Click Login Box
// ==============================

loginBox.addEventListener("dblclick",function(){

    loginBox.style.transform="scale(1.05)";

    setTimeout(function(){

        loginBox.style.transform="scale(1)";

    },300);

});

document.addEventListener("keydown",function(event){

    if(event.key==="Enter"){

        loginBtn.click();

    }

});

// ==============================
// Password Show Hide
// ==============================

password.addEventListener("dblclick",function(){

    if(password.type==="password"){

        password.type="text";

    }

    else{

        password.type="password";

    }

});

// ==============================
// Welcome Back
// ==============================

window.onload=function(){

    let storedEmail=localStorage.getItem("Email");

    if(storedEmail){

        email.value=storedEmail;

    }

}



// ==============================
// Button Hover Effect
// ==============================

loginBtn.addEventListener("mouseover",function(){

    loginBtn.style.transform="scale(1.05)";

});

loginBtn.addEventListener("mouseout",function(){

    loginBtn.style.transform="scale(1)";

});

// ==============================
// Character Counter
// ==============================

password.addEventListener("input",function(){

    console.log("Password Length :",password.value.length);

});

document.addEventListener("contextmenu",function(event){

    event.preventDefault();

});

// ==============================
// Caps Lock Detection
// ==============================

password.addEventListener("keyup",function(event){

    if(event.getModifierState("CapsLock")){

        console.log("Caps Lock is ON");

    }

});

// ==============================
// Random Background Every 5 Seconds
// ==============================

const colors=[
"#0f2027",
"#1d3557",
"#6a0572",
"#003049",
"#14213d"
];

setInterval(function(){

    let random=Math.floor(Math.random()*colors.length);

    body.style.background=colors[random];

},5000);
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Background Blur Circles */

.circle1{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:#00e5ff;
    filter:blur(90px);
    top:-80px;
    left:-70px;
    opacity:.7;
}

.circle2{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:#ff00c8;
    filter:blur(100px);
    bottom:-80px;
    right:-60px;
    opacity:.7;
}

/* Navbar */

nav{
    position:fixed;
    top:0;
    width:100%;
    height:70px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
    z-index:100;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:40px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    font-size:18px;
    transition:.3s;
}

nav ul li a:hover{
    color:#00ffff;
}

/* Login Box */

.login{
    width:380px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:35px;
    color:white;
    position:relative;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    z-index:10;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:22px;
    cursor:pointer;
}

.login h2{
    text-align:center;
    margin-bottom:30px;
}

.login input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    outline:none;
    border-radius:8px;
}

.login button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#00d9ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.login button:hover{
    background:#0099ff;
}

/* Chat Button */

.chat{
    position:fixed;
    bottom:25px;
    right:25px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#00c3ff;
    color:white;
    font-size:32px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow:0 0 30px #00c3ff;
    transition:.3s;
}

.chat:hover{
    transform:scale(1.1);
}

</style>

</head>
<body>

<div class="circle1"></div>
<div class="circle2"></div>

<nav>

<div class="logo">
MyWebsite
</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Contact</a></li>
<li><a href="#">Info</a></li>
</ul>

</nav>

<div class="login">

<div class="close">✖</div>

<h2>Login</h2>

<input type="email" placeholder="Enter Email">

<input type="password" placeholder="Enter Password">

<button>Login</button>

</div>

<div class="chat">
💬
</div>

</body>
</html>
