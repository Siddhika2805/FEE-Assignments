<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background-color:#333;
    padding:15px 30px;
}

.logo{
    color:white;
    font-size:28px;
}

.box{
    display:flex;
    gap:30px;
}

.childbox{
    color:white;
    font-size:18px;
    cursor:pointer;
}

.childbox:hover{
    color:yellow;
}
</style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        MyLogo
    </div>

    <div class="box">
        <div class="childbox">Home</div>
        <div class="childbox">About</div>
        <div class="childbox">Services</div>
        <div class="childbox">Gallery</div>
        <div class="childbox">Contact</div>
    </div>

</div>

</body>
</html>
